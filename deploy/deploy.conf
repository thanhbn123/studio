# =============================================================================
# CẤU HÌNH TRIỂN KHAI — VIP PRODUCT STUDIO  (KHÔNG chứa secret, có trong Git)
# =============================================================================
PROJECT=vip-product-studio

APP_ROOT=/opt/vip/vip-product-studio
KEEP_RELEASES=5

HEALTH_PATH=/api/health
READY_PATH=/api/health

STAGING_RUNTIME=compose
PRODUCTION_RUNTIME=compose

# `app` trong docker-compose.yml gắn cứng "3000:3000". Hai môi trường trên cùng
# một máy chủ sẽ đâm cổng, nên mỗi môi trường có file ghi đè riêng đổi cổng NGOÀI
# (cổng trong container vẫn 3000).
STAGING_PORT=13000
PRODUCTION_PORT=13100

COMPOSE_APP_SERVICE=app
COMPOSE_DB_SERVICE=db

# Phải KHỚP docker-compose.yml: postgres://studio:...@db:5432/studio
PG_DB=studio
PG_USER=studio

# --- Kiểm tra tại máy ----------------------------------------------------
# Lấy đúng những gì CI chạy (.github/workflows/ci.yml: test-sqlite, test-postgres,
# smoke). Playwright/trình duyệt: dự án này không có.
#
# `node --test --test-concurrency=1` là lệnh trong package.json, giữ nguyên cờ
# đó — bộ test dùng CSDL dùng chung nên chạy song song là tự gây đỏ ngẫu nhiên.
LOCAL_TEST_CMDS=(
  'npm test'
  'node src/store/migrate.js --driver sqlite'
  'node tools/verify.mjs'
)

# --- Host: CỐ Ý ĐỂ TRỐNG -------------------------------------------------
# Dự án này CHƯA triển khai ở đâu (đo 07/10/2026: không script nào trong repo
# gọi ssh/scp/rsync). Bộ này dựng TRƯỚC lượt triển khai đầu tiên, theo §20.6
# của CLAUDE.md — có deploy/ trước, rồi mới triển khai, không triển khai tay
# rồi hợp thức hoá sau.
STAGING_HOST=
STAGING_USER=
STAGING_SSH_KEY=
STAGING_URL=

PRODUCTION_HOST=
PRODUCTION_USER=
PRODUCTION_SSH_KEY=
PRODUCTION_URL=
