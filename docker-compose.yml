# Docker Compose — chạy cả app và PostgreSQL.
#
# Dùng:  docker compose up --build
# Rồi mở http://localhost:3000
#
# Secret KHÔNG được ghi thẳng ở đây. Đặt chúng trong file `.env` (đã gitignore)
# cùng thư mục; compose sẽ tự đọc.

services:
  app:
    build: .
    image: vip-product-studio:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DB_DRIVER: postgres
      DATABASE_URL: postgres://studio:${POSTGRES_PASSWORD:-studio}@db:5432/studio

      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      VISION_PROVIDER: ${VISION_PROVIDER:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}

      # Mặc định TẮT truy cập mạng nội bộ — chỉ bật khi test cục bộ có kiểm soát.
      ALLOW_PRIVATE_NETWORK: "false"
      SESSION_MODE: ${SESSION_MODE:-none}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
